name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frontend)
        run: bun install

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: bun add -g @tauri-apps/cli

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Prepare release assets
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NSIS_DIR="src-tauri/target/release/bundle/nsis"

          # Copy portable exe
          cp "src-tauri/target/release/sprite-forge.exe" "src-tauri/target/release/sprite-forge-portable.exe"

          # Create the update zip bundle
          cd "$NSIS_DIR"
          7z a -tzip "sprite-forge_${VERSION}_x64-setup.nsis.zip" "sprite-forge_${VERSION}_x64-setup.exe"

      - name: Sign update bundle
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NSIS_DIR="src-tauri/target/release/bundle/nsis"

          # Sign the zip file by passing the private key directly
          bun tauri signer sign --private-key "${{ secrets.TAURI_PRIVATE_KEY }}" --password "${{ secrets.TAURI_KEY_PASSWORD }}" "$NSIS_DIR/sprite-forge_${VERSION}_x64-setup.nsis.zip"

      - name: Read signature file
        id: signature
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SIG=$(cat "src-tauri/target/release/bundle/nsis/sprite-forge_${VERSION}_x64-setup.nsis.zip.sig")
          echo "signature=$SIG" >> $GITHUB_OUTPUT

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 'Sprite Forge v${{ steps.version.outputs.version }}'
          body: 'See the assets to download this version and install.'
          files: |
            src-tauri/target/release/bundle/nsis/sprite-forge_${{ steps.version.outputs.version }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/sprite-forge_${{ steps.version.outputs.version }}_x64-setup.nsis.zip
            src-tauri/target/release/sprite-forge-portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update updater.json
        shell: bash
        run: |
          cat > public/updater.json << EOF
          {
            "url": "https://github.com/Frenvius/sprite-forge/releases/download/v${{ steps.version.outputs.version }}/sprite-forge_${{ steps.version.outputs.version }}_x64-setup.nsis.zip",
            "version": "${{ steps.version.outputs.version }}",
            "signature": "${{ steps.signature.outputs.signature }}"
          }
          EOF

      - name: Commit updater.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/updater.json
          git commit -m "chore: update updater.json for v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
