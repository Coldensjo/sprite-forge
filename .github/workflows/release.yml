name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frontend)
        run: bun install

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Tauri app (without release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Copy portable exe
        run: |
          copy "src-tauri\target\release\sprite-forge.exe" "src-tauri\target\release\sprite-forge-portable.exe"

      - name: Read signature file
        id: signature
        shell: bash
        run: |
          SIG=$(cat "src-tauri/target/release/bundle/nsis/sprite-forge_${{ steps.version.outputs.version }}_x64-setup.nsis.zip.sig")
          echo "signature=$SIG" >> $GITHUB_OUTPUT

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          name: 'Sprite Forge v${{ steps.version.outputs.version }}'
          body: 'See the assets to download this version and install.'
          files: |
            src-tauri/target/release/bundle/nsis/sprite-forge_${{ steps.version.outputs.version }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/sprite-forge_${{ steps.version.outputs.version }}_x64-setup.nsis.zip
            src-tauri/target/release/sprite-forge-portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update updater.json
        shell: bash
        run: |
          cat > public/updater.json << EOF
          {
            "url": "https://github.com/Frenvius/sprite-forge/releases/download/v${{ steps.version.outputs.version }}/sprite-forge_${{ steps.version.outputs.version }}_x64-setup.nsis.zip",
            "version": "${{ steps.version.outputs.version }}",
            "signature": "${{ steps.signature.outputs.signature }}"
          }
          EOF

      - name: Commit updater.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/updater.json
          git commit -m "chore: update updater.json for v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
